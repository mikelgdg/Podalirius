[project]
name = "triagemri"
version = "0.1.0"
description = "Sistema generalista de triaje y descarte de normalidad en RM 3D"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.1",
    "monai>=1.3",
    "pytorch-lightning>=2.1",
    "nibabel>=5.1",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pydicom>=2.4",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "gradio>=4.0",
    "einops>=0.7",
    "timm>=0.9",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.scripts]
triage-train = "triagemri.cli.train:main"
triage-eval = "triagemri.cli.evaluate:main"
triage-demo = "triagemri.cli.demo:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "black>=23.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
