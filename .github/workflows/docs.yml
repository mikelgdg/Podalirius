name: Docs

on:
  push:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "src/triagemri/**"
  pull_request:
    paths:
      - "docs/**"
      - "src/triagemri/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build docs
        run: |
          sphinx-build -b html docs/source docs/_build -W --keep-going
      - name: Check for warnings
        run: |
          if [ -f docs/_build/warnings.txt ]; then
            echo "Warnings found!"
            cat docs/_build/warnings.txt
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/
