training:
  batch_size: 2
  num_workers: 4
  max_epochs: 100
  deterministic: false
  gradient_accumulation_steps: 4
  decoder_warmup_epochs: 5

  optimizer:
    name: "adamw"
    lr: 5.0e-4
    weight_decay: 1.0e-3
    exclude_bias_decay: true

  scheduler:
    name: "cosine_annealing"
    warmup_epochs: 5
    min_lr: 1.0e-6

  loss:
    name: "multi_task"
    lambda_bce: 1.0
    lambda_smooth: 0.05
    lambda_attn: 0.02
    lambda_mask: 0.1
    lambda_dice: 0.1

  imbalance:
    use_weighted_sampler: true

  early_stopping:
    monitor: "val/roc_auc"
    patience: 15
    min_delta: 0.001
    mode: "max"

  checkpoint:
    monitor: "val/roc_auc"
    mode: "max"
    save_top_k: 3

  calibration:
    method: "platt"

  precision: "16-mixed"
  accelerator: "auto"
  devices: 1

  seed: 42

evaluation:
  target_sensitivity: 0.99
  inconclusive_range: [0.3, 0.7]
